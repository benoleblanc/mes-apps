<title>Accès protégé</title>
<style>
  :root { color-scheme: light dark; --fond: #f4f6f9; --surface: #fff; --texte: #1b2230; --discret: #566174; --bordure: #d5dbe4; --accent: #1b5ab8; --sur-accent: #fff; --danger: #b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --fond: #11151b; --surface: #1a212b; --texte: #e8ecf2; --discret: #a0abbd; --bordure: #2f3846; --accent: #7db0ff; --sur-accent: #0c1220; --danger: #ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--fond); color: var(--texte); font: 16px/1.5 system-ui, "Segoe UI", Roboto, sans-serif; }
  form { width: 100%; max-width: 22rem; display: grid; gap: 0.75rem; padding: 20px; background: var(--surface); border: 1px solid var(--bordure); border-radius: 12px; }
  h1 { margin: 0 0 0.25rem; font-size: 1.25rem; }
  label { font-size: 0.9rem; color: var(--discret); }
  input, button { font: inherit; min-height: 48px; border-radius: 8px; padding: 0 0.75rem; }
  input { width: 100%; border: 1px solid var(--bordure); background: var(--surface); color: var(--texte); }
  button { border: 1px solid var(--accent); background: var(--accent); color: var(--sur-accent); font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #message { margin: 0; min-height: 1.5rem; color: var(--discret); }
  #message.erreur { color: var(--danger); font-weight: 600; }
</style>

<script>
// Ce fichier est copié tel quel dans la page verrouillée : il s'exécute dans le NAVIGATEUR (téléphone, tablette…).
// Il doit rester du JavaScript simple, sans « import ». Les tests exécutent ce même fichier.
//
// Déchiffre la charge avec le mot de passe (PBKDF2-SHA-256 puis AES-256-GCM).
// Si le mot de passe est faux, la promesse est rejetée : rien n'est affiché.
async function dechiffrer(charge, motDePasse) {
  function octets(base64) {
    var binaire = atob(base64);
    var tableau = new Uint8Array(binaire.length);
    for (var i = 0; i < binaire.length; i++) tableau[i] = binaire.charCodeAt(i);
    return tableau;
  }
  // Même règle qu'au chiffrement : forme NFC, sans espaces au début ni à la fin.
  var saisi = new TextEncoder().encode(String(motDePasse).normalize("NFC").trim());
  var cleDeBase = await crypto.subtle.importKey("raw", saisi, "PBKDF2", false, ["deriveKey"]);
  var cle = await crypto.subtle.deriveKey(
    { name: "PBKDF2", hash: "SHA-256", salt: octets(charge.sel), iterations: charge.iterations },
    cleDeBase,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
  var clair = await crypto.subtle.decrypt({ name: "AES-GCM", iv: octets(charge.iv) }, cle, octets(charge.texte));
  return new TextDecoder("utf-8").decode(clair);
}

(function () {
  var formulaire = document.getElementById("verrou");
  var champ = document.getElementById("mdp");
  var bouton = document.getElementById("ouvrir");
  var message = document.getElementById("message");
  function dire(texte, erreur) {
    message.textContent = texte;
    message.className = erreur ? "erreur" : "";
  }
  if (!window.crypto || !window.crypto.subtle) {
    bouton.disabled = true;
    dire("Ce navigateur ne peut pas ouvrir cette page.", true);
    return;
  }
  var charge = JSON.parse(document.getElementById("charge").textContent);
  formulaire.addEventListener("submit", function (evenement) {
    evenement.preventDefault();
    bouton.disabled = true;
    dire("Ouverture…", false);
    dechiffrer(charge, champ.value).then(
      function (page) {
        document.open();
        document.write(page);
        document.close();
      },
      function () {
        bouton.disabled = false;
        dire("Mot de passe incorrect.", true);
        champ.select();
      }
    );
  });
})();
</script>
